<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>يوسف وتسنيم - دعوة الخطوبة</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;700&family=Alex+Brush&display=swap" rel="stylesheet">
</head>
<body>
    <!-- حاوية لتأثير القلوب المتساقطة -->
    <div id="hearts-container"></div>

    <div class="container">
        <div class="content">
            <h1>حفل خطوبة</h1>
            <div class="names">يوسف & تسنيم</div>
            <p class="date-info">04.08.2026 | 7:00 مساءً</p>
            
            <div id="countdown" class="countdown-container">
                <div class="time-box">
                    <span id="days">00</span>
                    <label>أيام</label>
                </div>
                <div class="time-box">
                    <span id="hours">00</span>
                    <label>ساعات</label>
                </div>
                <div class="time-box">
                    <span id="minutes">00</span>
                    <label>دقائق</label>
                </div>
                <div class="time-box">
                    <span id="seconds">00</span>
                    <label>ثواني</label>
                </div>
            </div>

            <!-- Video Einladung Sektion -->
            <div class="video-section">
                <h3>فيديو الدعوة</h3>
                <div class="video-wrapper">
                    <video controls poster="poster.jpg">
                        <source src="invitation.mp4" type="video/mp4">
                        متصفحك لا يدعم تشغيل الفيديو.
                    </video>
                </div>
            </div>

            <div class="message">
                لا يمكننا الانتظار لرؤيتكم! ❤️
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
